<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba QR HD</title>
<style>body{font-family:Arial;background:#0b1020;color:white;margin:0}main{max-width:850px;margin:auto;padding:14px}.c{background:#151e3d;padding:14px;border-radius:15px;margin-bottom:14px}video,canvas{width:100%;background:#000;border-radius:12px}button{padding:13px;margin:4px;border:0;border-radius:10px;font-weight:bold}.a{background:white}.b{background:#334269;color:white}.s{background:#0d1430;padding:10px;border-radius:9px;margin-top:8px}pre{white-space:pre-wrap;font-size:12px}</style></head>
<body><main><div class="c"><h2>Fase 1.3.2 — QR alta resolución</h2><p>Misma cámara directa. Sin ZXing ni jsQR. Prueba ImageCapture + BarcodeDetector.</p>
<video id="v" autoplay playsinline muted></video><div id="s" class="s">Detenida.</div>
<button class="a" onclick="start()">INICIAR CÁMARA</button><button class="b" onclick="photo()">CAPTURAR FOTO HD Y LEER QR</button><button class="b" onclick="frame()">LEER FOTOGRAMA</button><button class="b" onclick="flip()">CAMBIAR CÁMARA</button></div>
<div class="c"><b>Resultado</b><div id="r" class="s">Sin prueba.</div></div><div class="c"><b>Diagnóstico</b><pre id="d">Sin datos.</pre></div><div class="c"><b>Imagen</b><canvas id="c"></canvas></div></main>
<script>
const v=document.getElementById('v'),c=document.getElementById('c'),x=c.getContext('2d'),s=document.getElementById('s'),r=document.getElementById('r'),d=document.getElementById('d');let st=null,face='environment',bd=null;
async function diag(extra=''){let t=st?.getVideoTracks()[0],a=t?.getSettings()||{},cap=t?.getCapabilities?.()||{},f='N/D';if(window.BarcodeDetector?.getSupportedFormats)try{f=await BarcodeDetector.getSupportedFormats()}catch(e){f='ERR '+e};d.textContent='VIDEO\n'+v.videoWidth+' x '+v.videoHeight+'\n\nSETTINGS\n'+JSON.stringify(a,null,2)+'\n\nCAPACIDADES\n'+JSON.stringify(cap,null,2)+'\n\nImageCapture='+('ImageCapture'in window)+'\nBarcodeDetector='+('BarcodeDetector'in window)+'\nFORMATOS='+JSON.stringify(f)+'\n\n'+navigator.userAgent+'\n\n'+extra}
async function start(){try{if(st)stop();s.textContent='Solicitando cámara…';let ds=await navigator.mediaDevices.enumerateDevices(),cs=ds.filter(q=>q.kind==='videoinput'),id='';if(face==='environment'){let q=cs.find(z=>/back|rear|environment|trasera|posterior/i.test(z.label));if(q)id=q.deviceId}st=await navigator.mediaDevices.getUserMedia(id?{video:{deviceId:{exact:id}},audio:false}:{video:{facingMode:{ideal:face}},audio:false});v.srcObject=st;await v.play();let t=st.getVideoTracks()[0],cap=t.getCapabilities?.()||{};if(cap.focusMode?.includes?.('continuous'))try{await t.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}s.textContent='Cámara activa.';if('BarcodeDetector'in window)try{bd=new BarcodeDetector({formats:['qr_code']})}catch(e){bd=new BarcodeDetector()}await diag('Cámara iniciada.')}catch(e){s.textContent='ERROR '+e.name+' — '+e.message;d.textContent=e.stack}}
function stop(){if(st)st.getTracks().forEach(t=>t.stop());st=null;v.srcObject=null;s.textContent='Detenida.'}
async function read(im,label){if(!bd){r.textContent='Chrome no expone BarcodeDetector.';return}try{let q=await bd.detect(im);if(q.length){r.innerHTML='<b style="color:#86efac">QR DETECTADO: '+q[0].rawValue+'</b>';await diag(label+' — ENCONTRADO');}else{r.textContent='No encontró QR en '+label;await diag(label+' — sin detección')}}catch(e){r.textContent='ERROR: '+e.name+' — '+e.message}}
async function frame(){if(!st)return;try{if('ImageCapture'in window){let b=await new ImageCapture(st.getVideoTracks()[0]).grabFrame();c.width=b.width;c.height=b.height;x.drawImage(b,0,0);r.textContent='Fotograma '+b.width+'x'+b.height+' — leyendo…';await read(b,'grabFrame')}else{c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);await read(c,'canvas')}}catch(e){r.textContent='Error grabFrame: '+e.message}}
async function photo(){if(!st)return;try{if(!('ImageCapture'in window)){await frame();return}let ic=new ImageCapture(st.getVideoTracks()[0]),blob=await ic.takePhoto(),b=await createImageBitmap(blob);c.width=b.width;c.height=b.height;x.drawImage(b,0,0);r.textContent='Foto HD '+b.width+'x'+b.height+' — leyendo…';await read(b,'takePhoto')}catch(e){r.textContent='takePhoto falló: '+e.name+' — '+e.message+'; probando fotograma…';await frame()}}
function flip(){face=face==='environment'?'user':'environment';start()}
</script></body></html>
